app:
  id: food
  name: "Food"
  version: "0.1.0"
  description: "Household food management — recipes, meal planning, grocery lists, pantry tracking, nutrition, and family food intelligence."
  author: "PAS Team"
  pas_core_version: ">=0.1.0"
  license: "MIT"
  category: home
  tags:
    - food
    - recipes
    - meal-planning
    - grocery
    - cooking
    - nutrition
    - family
    - pantry
    - meal-prep
    - kitchen

capabilities:
  messages:
    intents:
      - "user wants to save a recipe"
      - "user wants to search for a recipe"
      - "user wants to plan meals for the week"
      - "user wants to see or modify the grocery list"
      - "user wants to add items to the grocery list"
      - "user wants to know what's for dinner"
      - "user has a food-related question"
      - "user wants to start cooking a recipe"
      - "user wants to check or update the pantry"
      - "user wants to log leftovers"
      - "user wants to plan a meal or menu for a dinner party or guests they are hosting"
      - "user wants to see food spending"
      - "user wants to see receipt details or look up items from a receipt"
      - "user asks about prices at a specific store"
      - "user wants to see nutrition information"
      - "user wants to know what they can make with what they have"
      - "user wants to adapt a recipe for a child"
      - "user wants to log a new food introduction for a child"
      - "user wants to tag a recipe as kid-approved or rejected"
      - "user wants to log a meal they cooked by name with an optional portion"
      - "user wants to log an unfamiliar meal with a free-text description"
      - "user wants to save a frequent meal as a quick-meal template"
      - "user wants to set or change their nutrition or macro targets"
      - "user wants to see how well they are hitting their macro targets over time"
      - "user wants to understand how their diet is affecting their health or energy"
      - "user wants holiday or cultural recipe suggestions"
    commands:
      - name: /recipes
        description: "Browse and search your recipe library"
      - name: /mealplan
        description: "View current meal plan or generate a new one"
      - name: /grocery
        description: "View the current grocery list"
      - name: /addgrocery
        description: "Quick-add items to the grocery list"
        args: ["items"]
      - name: /pantry
        description: "View or update pantry inventory"
      - name: /freezer
        description: "View or update freezer inventory"
      - name: /cook
        description: "Start cook mode for a recipe"
        args: ["recipe"]
      - name: /leftovers
        description: "Log or view current leftovers"
      - name: /hosting
        description: "Plan a menu for hosting guests"
      - name: /foodbudget
        description: "View food cost tracking and reports"
      - name: /nutrition
        description: "View nutrition summaries and reports, log meals, and manage quick-meal templates (use subcommands: today, week, month, log, meals add|list|edit|remove, adherence, targets)"
      - name: /whatsfordinner
        description: "See what's planned for tonight"
      - name: /family
        description: "Manage child profiles and food introduction tracking"
      - name: /household
        description: "Create, join, or manage your household link"
    accepts_photos: true
    photo_intents:
      - "photo of a recipe to save"
      - "photo of a grocery receipt"
      - "photo of pantry or fridge contents"

  schedules:
    - id: generate-weekly-plan
      description: "Auto-generate the weekly meal plan and send for voting"
      cron: "0 9 * * 0"
      handler: "dist/handlers/generate-plan.js"
      user_scope: shared
    - id: finalize-votes
      description: "Check voting windows and finalize expired meal plan votes"
      cron: "0 * * * *"
      handler: "dist/handlers/voting.js"
      user_scope: shared
    - id: nightly-rating-prompt
      description: "Send nightly 'What did you cook?' rating prompts at 8pm"
      cron: "0 20 * * *"
      handler: "dist/handlers/rating.js"
      user_scope: shared
    - id: perishable-check
      description: "Check pantry for items approaching expiry"
      cron: "0 9 * * *"
      handler: "dist/handlers/perishable-check.js"
      user_scope: shared
    - id: freezer-check
      description: "Check freezer for items that should be used soon"
      cron: "0 9 * * 1"
      handler: "dist/handlers/freezer-check.js"
      user_scope: shared
    - id: leftover-check
      description: "Check leftovers approaching expiry"
      cron: "0 10 * * *"
      handler: "dist/handlers/leftover-check.js"
      user_scope: shared
    - id: seasonal-nudge
      description: "Suggest in-season recipes"
      cron: "0 10 1,15 * *"
      handler: "dist/handlers/seasonal-nudge.js"
      user_scope: shared
    - id: weekly-nutrition-summary
      description: "Send weekly macro/nutrition summary"
      cron: "0 20 * * 0"
      handler: "dist/handlers/nutrition-summary.js"
      user_scope: all
    - id: cuisine-diversity-check
      description: "Flag cuisine repetition in recent plans"
      cron: "0 8 * * 0"
      handler: "dist/handlers/cuisine-diversity.js"
      user_scope: shared
    - id: weekly-health-correlation
      description: "Weekly diet-performance correlation summary per user"
      cron: "0 9 * * 1"
      handler: "dist/handlers/health.js"
      user_scope: all
    - id: defrost-check
      description: "Check if tomorrow's meals need frozen ingredients defrosted"
      cron: "0 19 * * *"
      handler: "dist/handlers/defrost-check.js"
      user_scope: shared
    - id: cultural-calendar-check
      description: "Check for upcoming holidays and suggest themed recipes"
      cron: "0 10 * * 0"
      handler: "dist/handlers/cultural-calendar-handler.js"
      user_scope: shared

  events:
    emits:
      - id: "food:meal-plan-finalized"
        description: "Fired when a weekly meal plan is finalized after voting"
      - id: "food:grocery-list-ready"
        description: "Fired when a grocery list is generated or updated"
      - id: "food:recipe-scheduled"
        description: "Fired when a recipe is scheduled for a specific date"
      - id: "food:meal-cooked"
        description: "Fired when a meal is marked as cooked"
      - id: "food:shopping-completed"
        description: "Fired when a shopping session is completed"
    subscribes:
      - event: "health:daily-metrics"
        handler: "dist/events/subscribers.js"
        required: false

requirements:
  services:
    - telegram
    - data-store
    - llm
    - scheduler
    - event-bus
    - audio
    - context-store
    - interaction-context
    - data-query
    - app-outbound-bridge
  data:
    shared_scopes:
      - path: "recipes/"
        access: read-write
        description: "Recipe library shared across the household"
      - path: "meal-plans/"
        access: read-write
        description: "Weekly meal plans and archives"
      - path: "grocery/"
        access: read-write
        description: "Active and historical grocery lists"
      - path: "pantry.yaml"
        access: read-write
        description: "Pantry inventory"
      - path: "freezer.yaml"
        access: read-write
        description: "Freezer inventory"
      - path: "leftovers.yaml"
        access: read-write
        description: "Leftover tracker"
      - path: "household.yaml"
        access: read-write
        description: "Household membership and shared config"
      - path: "children/"
        access: read-write
        description: "Child food logs and allergen tracking"
      - path: "guests.yaml"
        access: read-write
        description: "Frequent guest dietary profiles"
      - path: "receipts/"
        access: read-write
        description: "Grocery receipt data and photos"
      - path: "photos/"
        access: read-write
        description: "Original photos from recipe and pantry captures"
      - path: "seasonal/"
        access: read-write
        description: "Seasonal produce reference data"
      - path: "cultural-calendar.yaml"
        access: read-write
        description: "Household cultural calendar with holiday preferences"
      - path: "waste-log.yaml"
        access: read-write
        description: "Food waste tracking"
      - path: "prices/"
        access: read-write
        description: "Per-store price database files"
      - path: "cost-history/"
        access: read-write
        description: "Weekly grocery cost history summaries"
    user_scopes:
      - path: "preferences.yaml"
        access: read-write
        description: "Individual dietary preferences and macro targets"
      - path: "nutrition/"
        access: read-write
        description: "Per-user monthly macro intake logs"
      - path: "shopping-sessions/"
        access: read-write
        description: "Shopping mode session history"
      - path: "health/"
        access: read-write
        description: "Per-user monthly health metrics from cross-app events"
      - path: "ad-hoc-history.yaml"
        access: read-write
        description: "Rolling 30-day ad-hoc meal log dedup history"
      - path: "quick-meals.yaml"
        access: read-write
        description: "Quick-meal templates and archive"
      - path: "corrupt/"
        access: read-write
        description: "Corrupt YAML recovery sidecars (rare, written only on YAML parse failure)"
  llm:
    tier: standard
    rate_limit:
      max_requests: 60
      window_seconds: 3600
    monthly_cost_cap: 15.00

user_config:
  - key: meal_plan_dinners
    type: number
    default: 5
    min: 1
    max: 7
    description: "Number of dinners to plan per week"
    label: "Dinners per week"
    help: "How many dinners to include in your weekly meal plan."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|how many).*(dinner|meal.plan)|(dinner|meal.plan).*(per week|in my plan|per night)"
  - key: new_recipe_ratio
    type: number
    default: 40
    min: 0
    max: 100
    description: "Percentage of meals that should be new recipes (0-100)"
    label: "New recipe ratio (%)"
    help: "Percentage of planned meals that should introduce a new recipe (0–100)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|lower|raise|increase|decrease).*(new.recipe|recipe.ratio|recipe.percent)|(new.recipe|recipe.ratio).*(set|change|update|lower|raise)"
  - key: dietary_preferences
    type: string
    default: ""
    description: "Comma-separated dietary preferences (e.g., healthy, easy)"
    label: "Dietary preferences"
    help: "Your general food preferences used when generating meal plans (e.g., healthy, easy, vegetarian)."
    category: food
    nlSafe: true
    nlIntentRegex: "(update|change|set|add|remove).*(dietary.preference|food.preference)|(dietary.preference|food.preference).*(update|change|set)"
  - key: dietary_restrictions
    type: string
    default: ""
    description: "Comma-separated dietary restrictions (e.g., no red meat on weekdays)"
    label: "Dietary restrictions"
    help: "Hard restrictions applied to all meal planning (e.g., gluten-free, no red meat on weekdays)."
    category: food
    nlSafe: true
    nlIntentRegex: "(update|change|set|add|remove).*(dietary.restriction|food.restriction)|(dietary.restriction|food.restriction).*(update|change|set)"
  - key: voting_window_hours
    type: number
    default: 12
    description: "Hours household members have to vote on meal plans"
    label: "Voting window (hours)"
    help: "How many hours household members have to vote on a proposed meal plan before it is finalized."
    category: food
  - key: rating_reminder_delay
    type: number
    default: 120
    description: "Minutes after expected cook time to ask for ratings"
    label: "Rating reminder delay (minutes)"
    help: "How many minutes after the expected cook time to send a rating prompt for the meal."
    category: food
  - key: preferred_stores
    type: string
    default: ""
    description: "Comma-separated list of stores for price comparison"
    label: "Preferred stores"
    help: "Comma-separated list of grocery stores used for price comparison (e.g., Trader Joe's, Whole Foods)."
    category: food
  - key: default_store
    type: string
    default: ""
    description: "Default store for price estimates"
    label: "Default grocery store"
    help: "Your preferred store used when generating price estimates and grocery suggestions."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(default.store|default.grocery|grocery.store)|(default.store|default.grocery).*(set|change|update|to)"
  - key: show_price_estimates
    type: boolean
    default: false
    description: "Show estimated prices on grocery lists"
    label: "Show price estimates"
    help: "Display estimated item costs on grocery lists based on your price history."
    category: food
    nlSafe: true
    nlIntentRegex: "(show|hide|enable|disable|stop|turn).*(price.estimate|cost.estimate|pricing)|(price.estimate|cost.estimate|pricing).*(on|off|enable|disable)"
  - key: staple_items
    type: string
    default: "salt,pepper,olive oil,butter,garlic"
    description: "Comma-separated items assumed to be on hand"
    label: "Staple items"
    help: "Comma-separated pantry staples assumed to always be on hand, so they are excluded from grocery lists."
    category: food
  - key: shopping_followup_hours
    type: number
    default: 24
    description: "Hours after shopping mode to send follow-up"
    label: "Shopping follow-up delay (hours)"
    help: "How many hours after completing a shopping session to send a follow-up check-in message."
    category: food
  - key: location
    type: string
    default: "Raleigh, NC"
    description: "Your location for seasonal produce awareness (e.g., 'Boston, MA', 'Portland, OR')"
    label: "Location"
    help: "Your city and state used for seasonal produce awareness and region-specific recipe suggestions (e.g., Boston, MA)."
    category: food
  - key: seasonal_nudges
    type: boolean
    default: true
    description: "Send seasonal produce suggestions"
    label: "Seasonal nudges"
    help: "Receive bi-monthly recipe suggestions featuring in-season produce for your region."
    category: food
    nlSafe: true
    nlIntentRegex: "(turn|switch|enable|disable|stop|start).*(seasonal|season).*(nudge|suggestion)|seasonal.*(nudge|suggestion).*(on|off|enable|disable)"
  - key: child_meal_adaptation
    type: boolean
    default: true
    description: "Auto-suggest kid-friendly recipe adaptations"
    label: "Kid meal adaptation"
    help: "Automatically suggest child-friendly versions of recipes when kid profiles are set up."
    category: food
    nlSafe: true
    nlIntentRegex: "(turn|enable|disable|toggle).*(kid|child|children|toddler).*(meal|adapt|adjust)|(kid|child|children|toddler).*(meal|adapt|adjust).*(on|off)"
  - key: allergen_wait_days
    type: number
    default: 3
    description: "Days to wait between introducing new allergens for babies"
    label: "Allergen wait period (days)"
    help: "Number of days to wait between introducing each new allergenic food to a baby or young child."
    category: food
  - key: cooking_speaker_device
    type: string
    default: ""
    description: "Chromecast/Google Home device name for hands-free cooking. Leave empty for system default."
    label: "Cooking speaker device"
    help: "Name of the Chromecast or Google Home device to use for hands-free cooking audio. Leave empty to use the system default."
    category: food
  - key: hands_free_default
    type: boolean
    default: false
    description: "Automatically enable voice output when starting cook mode (skip the prompt)."
    label: "Hands-free default"
    help: "Start cook mode in hands-free (voice) mode automatically without asking each time."
    category: food
    nlSafe: true
    nlIntentRegex: "(turn|enable|disable|set).*(hands.free|handsfree)|(hands.free|handsfree).*(on|off|enable|disable|default)"
  - key: macro_target_calories
    type: number
    default: 0
    min: 0
    max: 10000
    description: "Daily calorie target (0 = not set)"
    label: "Daily calorie target"
    help: "Your daily calorie goal used for nutrition tracking and meal planning (0 = not set)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(calorie.target|target.calorie|calorie.goal)|calorie.target.*(set|change|update|to)"
  - key: macro_target_protein
    type: number
    default: 0
    min: 0
    max: 1000
    description: "Daily protein target in grams (0 = not set)"
    label: "Daily protein target (g)"
    help: "Your daily protein goal in grams used for nutrition tracking (0 = not set)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(protein.target|target.protein|protein.goal)|protein.target.*(set|change|update|to)"
  - key: macro_target_carbs
    type: number
    default: 0
    min: 0
    max: 2000
    description: "Daily carbs target in grams (0 = not set)"
    label: "Daily carbs target (g)"
    help: "Your daily carbohydrate goal in grams used for nutrition tracking (0 = not set)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(carb.target|target.carb|carb.goal)|carb.target.*(set|change|update|to)"
  - key: macro_target_fat
    type: number
    default: 0
    min: 0
    max: 1000
    description: "Daily fat target in grams (0 = not set)"
    label: "Daily fat target (g)"
    help: "Your daily fat goal in grams used for nutrition tracking (0 = not set)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(fat.target|target.fat|fat.goal)|fat.target.*(set|change|update|to)"
  - key: macro_target_fiber
    type: number
    default: 0
    min: 0
    max: 200
    description: "Daily fiber target in grams (0 = not set)"
    label: "Daily fiber target (g)"
    help: "Your daily fiber goal in grams used for nutrition tracking (0 = not set)."
    category: food
    nlSafe: true
    nlIntentRegex: "(set|change|update|my).*(fiber.target|target.fiber|fiber.goal)|fiber.target.*(set|change|update|to)"
  - key: cultural_calendar
    type: boolean
    default: true
    description: "Send weekly recipe suggestions for upcoming cultural holidays and celebrations (does not affect on-demand queries)"
    label: "Cultural calendar suggestions"
    help: "Receive weekly recipe suggestions tied to upcoming cultural holidays and celebrations."
    category: food
    nlSafe: true
    nlIntentRegex: "(turn|enable|disable|toggle).*(cultural.calendar|cultural calendar)|(cultural.calendar|cultural calendar).*(on|off|enable|disable)"
  - key: shadow_sample_rate
    type: number
    default: 1
    description: "Fraction of text messages to send to the shadow LLM classifier (0 = off, 1 = all). Used for telemetry before classifier switchover."
    label: "Shadow classifier sample rate"
    help: "Fraction of messages routed through the shadow LLM classifier for telemetry (0 = off, 1 = all)."
    category: dangerous
    adminOnly: true
    dangerous: true
    dangerConfirmPrompt: "Changing the shadow sample rate affects LLM cost and telemetry coverage. Are you sure?"
  - key: routing_primary
    type: select
    default: regex
    description: "Primary routing strategy: 'regex' (Chunk C behavior) or 'shadow' (LLM-classified dispatch). Flip to 'shadow' only after the shadow-classifier log shows ≥95% agreement. Setting 'shadow' with shadow_sample_rate<1 produces inconsistent routing — a warning is logged at init."
    options: [regex, shadow]
    label: "Primary routing strategy"
    help: "Controls whether food message routing uses regex rules or the LLM shadow classifier."
    category: dangerous
    adminOnly: true
    dangerous: true
    dangerConfirmPrompt: "Switching routing_primary to 'shadow' changes how all food messages are dispatched. Only do this after reviewing the shadow classifier log (≥95% agreement). Are you sure?"
  - key: shadow_min_confidence
    type: number
    default: 0.7
    description: "Confidence floor for shadow-primary dispatch. Shadow outputs below this threshold fall through to the regex cascade. Ignored when routing_primary=regex."
    label: "Shadow classifier confidence floor"
    help: "Minimum confidence required for the shadow classifier to override regex routing (ignored when routing_primary=regex)."
    category: dangerous
    adminOnly: true
    dangerous: true
    dangerConfirmPrompt: "Lowering the confidence floor may cause incorrect message routing. Are you sure?"
