    # - llm                  # LLM access (classify / complete / extractStructured)
    # - scheduler            # One-off job scheduling
    # - context-store        # Per-user + system knowledge base
    # - data-query           # NL queries over your app's indexed data files
    # - interaction-context  # Per-user buffer of recent file interactions
    # - edit-service         # LLM-assisted file editing (propose/confirm flow)
